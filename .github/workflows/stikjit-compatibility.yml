name: Built-in StikJIT compatibility probe

on:
  push:
    branches: [feature/builtin-stikjit-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify the vendored framework
        run: |
          set -euo pipefail
          xcodebuild -version
          cd wolkaraforever/tools/jit/Fixture
          sha256sum -c StikJIT-VENDOR.sha256
      - name: Typecheck the preparation entry point against the vendored framework
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -target arm64-apple-ios17.4 -sdk "$sdk" \
            -F "$GITHUB_WORKSPACE/wolkaraforever/tools/jit/Fixture/StikJIT.xcframework/ios-arm64" \
            "$GITHUB_WORKSPACE/wolkaraforever/tools/jit/PreparationProbe.swift"
          echo 'StikJIT preparation API typecheck: PASS (not an integrated JIT build)'
      - name: Compile the embedded host and helper without signing
        run: |
          set -euo pipefail
          fixture=wolkaraforever/tools/jit/Fixture
          xcodegen generate --spec "$fixture/project.yml" --project "$fixture"
          xcodebuild -project "$fixture/StikJITHelperCompileFixture.xcodeproj" \
            -target JITProbeHost -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' SYMROOT="$RUNNER_TEMP/stikjit-products" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$RUNNER_TEMP/stikjit-products/Debug-iphoneos/JITProbeHost.app"
          test -d "$app/PlugIns/JITHelperFixture.appex"
          test -f "$app/PlugIns/JITHelperFixture.appex/Frameworks/StikJIT.framework/StikJIT" \
            || test -f "$app/Frameworks/StikJIT.framework/StikJIT"
          echo 'Host, embedded helper and framework built; no JIT activation tested.'
