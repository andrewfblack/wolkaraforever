name: StikJITHelperCompileFixture
options:
  deploymentTarget: { iOS: "17.4" }
targets:
  JITProbeHost:
    type: application
    platform: iOS
    sources: [Host.swift, HostBridge.m]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tolkara.jitfixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Host-Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: HostBridge.h
    dependencies:
      - target: JITHelperFixture
        embed: true
  JITHelperFixture:
    type: app-extension
    platform: iOS
    sources:
      - Helper.swift
      - ../PreparationProbe.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tolkara.jitfixture.helper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - framework: StikJIT.xcframework
        embed: true
