name: StikJITHelperCompileFixture
options:
  deploymentTarget: { iOS: "17.4" }
targets:
  JITProbeHost:
    type: application
    platform: iOS
    sources:
      - Host.swift
      - HostBridge.m
      - JITTest.c
      - ../../../../platform/runtime/DebuggerArena.c
      - ../../../../platform/runtime/NativeCodeMemory.c
      - ../../../../platform/runtime/HostDiagnostics.c
      - ../../../../platform/runtime/HostExecutionProbe.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tolkara.jitfixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_FILE: Host-Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: HostBridge.h
        HEADER_SEARCH_PATHS: ../../../../platform/runtime
        CODE_SIGN_ENTITLEMENTS: JITFixture.entitlements
    dependencies:
      - sdk: Security.framework
      - target: JITHelperFixture
        embed: true
  JITHelperFixture:
    type: app-extension
    platform: iOS
    sources:
      - Helper.swift
      - ../PreparationProbe.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tolkara.jitfixture.helper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - framework: StikJIT.xcframework
        embed: true
